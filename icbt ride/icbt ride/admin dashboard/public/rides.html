<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Ride Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { overflow-x: hidden; }
        .wrapper { display: flex; width: 100%; }
        
        #sidebar {
            width: 250px;
            min-height: 100vh;
            flex-shrink: 0;
            position: fixed;
            z-index: 100;
        }
        
        #content {
            width: calc(100% - 250px);
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }

        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background-color: #6366f1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .profile-text { font-size: 0.9rem; line-height: 1.2; }
        .verified-badge { color: var(--accent-success); font-size: 0.8rem; }
        .glass-box { background-color: var(--bg-card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); padding: 25px; }
        .box-title { color: var(--accent-primary); font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 1.1rem; }

        .table { color: var(--text-main); border-color: rgba(255,255,255,0.1); }
        .table th { background-color: rgba(0,0,0,0.2); color: var(--text-muted); border-bottom: 2px solid var(--border-color); font-weight: 500; }
        .table td { background-color: transparent; vertical-align: middle; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-car-side"></i> ICBT Ride
            </div>
            
            <ul class="list-unstyled">
                <li><a href="dashboard.html" class="nav-link text-decoration-none"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="users.html" class="nav-link text-decoration-none"><i class="fa-solid fa-users"></i> Users & Drivers</a></li>
                <li><a href="rides.html" class="nav-link active text-decoration-none"><i class="fa-solid fa-route"></i> Ride Management</a></li>
                <li><a href="complaints.html" class="nav-link text-decoration-none"><i class="fa-solid fa-triangle-exclamation"></i> Complaints</a></li>
                <li><a href="announcements.html" class="nav-link text-decoration-none"><i class="fa-solid fa-bullhorn"></i> Announcements</a></li>
            </ul>
            
            <div style="position: absolute; bottom: 30px; width: 100%;">
                <a href="#" id="logoutBtn" class="nav-link text-decoration-none text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </a>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
            
            <div class="top-header">
                <div>
                    <h2 class="text-white fw-bold mb-1">Ride Management</h2>
                    <p class="text-muted-custom">Monitor carpooling trips, check routes, and enforce Odd/Even rules.</p>
                </div>
                <div class="user-profile">
                    <i class="fa-regular fa-bell text-white fs-5 me-2"></i>
                    <div class="avatar" id="userInitial">A</div>
                    <div class="profile-text text-white text-end">
                        <span id="userEmail" class="d-block fw-bold">Admin</span>
                        <span class="verified-badge">Super Admin <i class="fa-solid fa-circle-check"></i></span>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="glass-box">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="box-title mb-0">
                        <i class="fa-solid fa-car"></i> Active & Past Rides
                    </div>
                    <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="loadRides()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Driver Name</th>
                                <th>Route</th>
                                <th>Date/Time</th>
                                <th>Seats</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ridesTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Loading rides...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import "./js/firebase-config.js";

        // Auth State Check
        window.onAuthStateChanged(window.firebaseAuth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInitial').textContent = user.email.charAt(0).toUpperCase();
                loadRides();
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await window.signOut(window.firebaseAuth);
            } catch (error) {
                console.error("Error signing out: ", error);
            }
        });

        // Fetch Rides Logic
        window.loadRides = async function() {
            const tableBody = document.getElementById('ridesTableBody');
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</td></tr>';
            
            try {
                const ridesCol = window.fsCollection(window.firebaseDb, 'rides');
                // Order by date descending if you have a date field, skipping for simple query
                const ridesSnapshot = await window.fsGetDocs(ridesCol);
                
                if(ridesSnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No rides found in database. Add rides in Firestore.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';
                ridesSnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    const currentStatus = data.status || 'active';
                    let statusBadge = currentStatus === 'active' ? '<span class="badge bg-success">Active</span>' : 
                                      currentStatus === 'completed' ? '<span class="badge bg-secondary">Completed</span>' : 
                                      '<span class="badge bg-danger">Cancelled</span>';

                    let actions = '';
                    if(currentStatus !== 'cancelled') {
                        actions += `<button class="btn btn-danger btn-sm rounded-pill px-3" onclick="cancelRide('${id}')">Cancel Ride</button>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.driverName || 'Unknown Driver'}</td>
                        <td>${data.startLocation || data.start || '?'} <i class="fa-solid fa-arrow-right mx-1 text-muted"></i> ${data.destination || data.dest || '?'}</td>
                        <td>${data.date || 'N/A'} at ${data.time || 'N/A'}</td>
                        <td>${data.availableSeats || data.seats || 0} left</td>
                        <td>${statusBadge}</td>
                        <td>${actions || '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch(error) {
                console.error("Error fetching rides: ", error);
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Error loading data. Check console.</td></tr>';
            }
        }

        // Cancel Ride Logic
        window.cancelRide = async function(docId) {
            if(!confirm("Are you sure you want to cancel this ride? (e.g. For Odd/Even rule violation)")) return;

            try {
                const rideRef = window.fsDoc(window.firebaseDb, 'rides', docId);
                await window.fsUpdateDoc(rideRef, { status: 'cancelled' });
                alert('Ride cancelled successfully!');
                loadRides(); // Refresh table
            } catch(error) {
                console.error("Error cancelling ride: ", error);
                alert("Error updating status.");
            }
        }
    </script>
</body>
</html>
