<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Users & Drivers</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { overflow-x: hidden; }
        .wrapper { display: flex; width: 100%; }
        
        #sidebar {
            width: 250px;
            min-height: 100vh;
            flex-shrink: 0;
            position: fixed;
            z-index: 100;
        }
        
        #content {
            width: calc(100% - 250px);
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #6366f1;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .profile-text {
            font-size: 0.9rem;
            line-height: 1.2;
        }
        
        .verified-badge {
            color: var(--accent-success);
            font-size: 0.8rem;
        }

        .glass-box {
            background-color: var(--bg-card);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 25px;
        }

        .box-title {
            color: var(--accent-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* Table Styles */
        .table {
            color: var(--text-main);
            border-color: rgba(255,255,255,0.1);
        }
        .table th {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-weight: 500;
        }
        .table td {
            background-color: transparent;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-car-side"></i> ICBT Ride
            </div>
            
            <ul class="list-unstyled">
                <li>
                    <a href="dashboard.html" class="nav-link text-decoration-none">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="users.html" class="nav-link active text-decoration-none">
                        <i class="fa-solid fa-users"></i> Users & Drivers
                    </a>
                </li>
                <li>
                    <a href="rides.html" class="nav-link text-decoration-none">
                        <i class="fa-solid fa-route"></i> Ride Management
                    </a>
                </li>
                <li>
                    <a href="complaints.html" class="nav-link text-decoration-none">
                        <i class="fa-solid fa-triangle-exclamation"></i> Complaints
                    </a>
                </li>
                <li>
                    <a href="announcements.html" class="nav-link text-decoration-none">
                        <i class="fa-solid fa-bullhorn"></i> Announcements
                    </a>
                </li>
            </ul>
            
            <div style="position: absolute; bottom: 30px; width: 100%;">
                <a href="#" id="logoutBtn" class="nav-link text-decoration-none text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </a>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
            
            <div class="top-header">
                <div>
                    <h2 class="text-white fw-bold mb-1">Users & Drivers</h2>
                    <p class="text-muted-custom">Manage registered passengers and verify driver accounts.</p>
                </div>
                <div class="user-profile">
                    <i class="fa-regular fa-bell text-white fs-5 me-2"></i>
                    <div class="avatar" id="userInitial">A</div>
                    <div class="profile-text text-white text-end">
                        <span id="userEmail" class="d-block fw-bold">Admin</span>
                        <span class="verified-badge">Super Admin <i class="fa-solid fa-circle-check"></i></span>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="glass-box">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="box-title mb-0">
                        <i class="fa-solid fa-list"></i> Registered Accounts
                    </div>
                    <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="loadUsers()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import "./js/firebase-config.js";

        // Auth State Check
        window.onAuthStateChanged(window.firebaseAuth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInitial').textContent = user.email.charAt(0).toUpperCase();
                loadUsers();
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await window.signOut(window.firebaseAuth);
            } catch (error) {
                console.error("Error signing out: ", error);
            }
        });

        // Fetch Users Logic
        window.loadUsers = async function() {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</td></tr>';
            
            try {
                const usersCol = window.fsCollection(window.firebaseDb, 'users');
                const userSnapshot = await window.fsGetDocs(usersCol);
                
                if(userSnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No users found in database. Add users in Firestore.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';
                userSnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    let roleBadge = data.role === 'driver' ? '<span class="badge bg-info">Driver</span>' : '<span class="badge bg-secondary">Passenger</span>';
                    let statusBadge = data.status === 'verified' ? '<span class="badge bg-success">Verified</span>' : 
                                      data.status === 'suspended' ? '<span class="badge bg-danger">Suspended</span>' : 
                                      '<span class="badge bg-warning text-dark">Pending</span>';

                    let actions = '';
                    if(data.role === 'driver' && data.status !== 'verified') {
                        actions += `<button class="btn btn-success btn-sm rounded-pill px-3 me-2" onclick="updateUserStatus('${id}', 'verified')">Verify</button>`;
                    }
                    if(data.status !== 'suspended') {
                        actions += `<button class="btn btn-danger btn-sm rounded-pill px-3" onclick="updateUserStatus('${id}', 'suspended')">Suspend</button>`;
                    } else {
                        actions += `<button class="btn btn-secondary btn-sm rounded-pill px-3" onclick="updateUserStatus('${id}', 'active')">Reactivate</button>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.name || 'Unknown'}</td>
                        <td>${data.email || 'N/A'}</td>
                        <td>${roleBadge}</td>
                        <td>${statusBadge}</td>
                        <td>${actions}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch(error) {
                console.error("Error fetching users: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Error loading data. Check console.</td></tr>';
            }
        }

        // Update User Status Logic
        window.updateUserStatus = async function(docId, newStatus) {
            try {
                const userRef = window.fsDoc(window.firebaseDb, 'users', docId);
                await window.fsUpdateDoc(userRef, { status: newStatus });
                alert('Status updated successfully!');
                loadUsers(); // Refresh table
            } catch(error) {
                console.error("Error updating user: ", error);
                alert("Error updating status.");
            }
        }
    </script>
</body>
</html>
