<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Login</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/main-login/css/style.css">
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICBT Ride">
    <link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <ul class="bg-slideshow">
        <li style="background-image: url('https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=2070&auto=format&fit=crop')"></li>
        <li style="background-image: url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?q=80&w=2070&auto=format&fit=crop')"></li>
        <li style="background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2021&auto=format&fit=crop')"></li>
        <li style="background-image: url('https://images.unsplash.com/photo-1519003722824-194d4455a60c?q=80&w=2075&auto=format&fit=crop')"></li>
    </ul>

    <div class="login-container">
        <div class="glass-box">
            
            <h2 class="brand-title">
                <img src="/icon-192.png" alt="ICBT Ride"> ICBT Ride
            </h2>

            <!-- Admin Login Form -->
            <div class="p-4">
                <form id="adminLoginForm">
                    <h4 class="text-center mb-3">Admin Login</h4>
                    <div class="mb-3">
                        <label class="form-label text-muted">Email Address</label>
                        <input type="email" class="form-control" id="a-login-email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" class="form-control" id="a-login-password" required>
                    </div>
                    <div class="error-msg" id="a-login-error"></div>
                    <button type="submit" class="btn btn-primary w-100" id="a-login-btn">Log In</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import "/admin-dashboard/js/firebase-config.js";

        async function verifyLogin(formId, btnId, errorId, redirectUrl) {
            const form = document.getElementById(formId);
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = e.target.querySelector('input[type="email"]').value.trim();
                const password = e.target.querySelector('input[type="password"]').value;
                
                const btn = document.getElementById(btnId);
                const errorMsg = document.getElementById(errorId);
                
                errorMsg.style.display = 'none';
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verifying...';
                btn.disabled = true;

                let loggedIn = false;

                // 1. Try Firebase Auth
                try {
                    await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                    localStorage.setItem('loggedInAdmin', email);
                    loggedIn = true;
                } catch(authError) {
                    console.warn("Firebase Auth sign-in failed, trying Firestore users collection...", authError);
                }

                // 2. Fallback to Firestore users collection
                if (!loggedIn) {
                    try {
                        const usersRef = window.fsCollection(window.firebaseDb, "users");
                        const snapshot = await window.fsGetDocs(usersRef);
                        snapshot.forEach(doc => {
                            const u = doc.data();
                            if (u.email && u.email.toLowerCase() === email.toLowerCase() && u.password === password && u.role === 'admin') {
                                loggedIn = true;
                                localStorage.setItem('loggedInAdmin', u.email);
                            }
                        });
                    } catch(dbError) {
                        console.error("Firestore query error:", dbError);
                    }
                }

                if (loggedIn) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Success!';
                    btn.classList.replace('btn-primary', 'btn-success');
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                } else {
                    errorMsg.innerText = "Invalid email or password.";
                    errorMsg.style.display = 'block';
                    btn.innerHTML = 'Log In';
                    btn.disabled = false;
                }
            });
        }

        verifyLogin('adminLoginForm', 'a-login-btn', 'a-login-error', 'dashboard.html');
    </script>
    <script src="/js/pwa-install.js"></script>
</body>
</html>
