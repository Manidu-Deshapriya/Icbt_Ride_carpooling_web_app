<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Admin Login</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="custom-card login-box">
            <div class="text-center mb-4">
                <i class="fa-solid fa-car-side fa-3x" style="color: var(--accent-primary);"></i>
                <h3 class="mt-3 ">Admin Portal</h3>
                <p class="text-muted-custom">ICBT Ride Management System</p>
            </div>

            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted-custom">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" placeholder="admin@icbtride.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-muted-custom">Password</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login to Dashboard</button>
            </form>
        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import "./js/firebase-config.js";

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }

        // Check if already logged in
        window.onAuthStateChanged(window.firebaseAuth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.classList.add('d-none');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';

            try {
                await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                // Redirect will happen automatically via onAuthStateChanged
            } catch (error) {
                errorDiv.textContent = 'Invalid credentials. Please try again.';
                errorDiv.classList.remove('d-none');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Dashboard';
            }
        });
    </script>
</body>
</html>
