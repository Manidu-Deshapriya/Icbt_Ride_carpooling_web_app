<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Complaints</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { overflow-x: hidden; }
        .wrapper { display: flex; width: 100%; }
        
        #sidebar { width: 250px; min-height: 100vh; flex-shrink: 0; position: fixed; z-index: 100; }
        #content { width: calc(100% - 250px); margin-left: 250px; padding: 30px; min-height: 100vh; }
        
        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background-color: var(--accent-secondary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .profile-text { font-size: 0.9rem; line-height: 1.2; }
        .verified-badge { color: var(--accent-success); font-size: 0.8rem; }
        .glass-box { background-color: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); padding: 25px; }
        .box-title { color: var(--accent-primary); font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 1.1rem; }

        .complaint-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .complaint-card:hover { border-color: var(--accent-primary); }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="brand"><i class="fa-solid fa-car-side"></i> ICBT Ride</div>
            <ul class="list-unstyled">
                <li><a href="dashboard.html" class="nav-link text-decoration-none"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="users.html" class="nav-link text-decoration-none"><i class="fa-solid fa-users"></i> Users & Drivers</a></li>
                <li><a href="rides.html" class="nav-link text-decoration-none"><i class="fa-solid fa-route"></i> Ride Management</a></li>
                <li><a href="complaints.html" class="nav-link active text-decoration-none"><i class="fa-solid fa-triangle-exclamation"></i> Complaints</a></li>
                <li><a href="announcements.html" class="nav-link text-decoration-none"><i class="fa-solid fa-bullhorn"></i> Announcements</a></li>
            </ul>
            <div style="position: absolute; bottom: 30px; width: 100%;">
                <a href="#" id="logoutBtn" class="nav-link text-decoration-none text-danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
            
            <div class="top-header">
                <div>
                    <h2 class=" fw-bold mb-1">Complaints & Feedback</h2>
                    <p class="text-muted-custom">Review and resolve issues reported by passengers or drivers.</p>
                </div>
                <div class="user-profile">
                    <a href="users.html" class="position-relative me-3 text-decoration-none">
                        <i class="fa-regular fa-bell  fs-5"></i>
                        <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">0</span>
                    </a>
                    <div class="avatar" id="userInitial">A</div>
                    <div class="profile-text  text-end">
                        <span id="userEmail" class="d-block fw-bold">Admin</span>
                        <span class="verified-badge">Super Admin <i class="fa-solid fa-circle-check"></i></span>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="glass-box">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="box-title mb-0"><i class="fa-solid fa-inbox"></i> Inbox</div>
                    <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="loadComplaints()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                
                <div id="complaintsList">
                    <div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading complaints...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import "./js/firebase-config.js";

        // Auth State Check
        window.onAuthStateChanged(window.firebaseAuth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInitial').textContent = user.email.charAt(0).toUpperCase();
                loadComplaints();
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try { await window.signOut(window.firebaseAuth); } 
            catch (error) { console.error("Error signing out: ", error); }
        });

        // Fetch Complaints Logic
        window.loadComplaints = async function() {
            const listContainer = document.getElementById('complaintsList');
            listContainer.innerHTML = '<div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</div>';
            
            try {
                const complaintsCol = window.fsCollection(window.firebaseDb, 'complaints');
                const snapshot = await window.fsGetDocs(complaintsCol);
                
                if(snapshot.empty) {
                    listContainer.innerHTML = '<div class="text-center text-muted py-4">No complaints found.</div>';
                    return;
                }

                listContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    let statusBadge = data.status === 'resolved' 
                        ? '<span class="badge bg-success">Resolved</span>' 
                        : '<span class="badge bg-warning text-dark">Pending</span>';

                    let actions = '';
                    if(data.status !== 'resolved') {
                        actions = `<button class="btn btn-outline-success btn-sm rounded-pill mt-3" onclick="resolveComplaint('${id}')"><i class="fa-solid fa-check"></i> Mark as Resolved</button>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'complaint-card';
                    card.innerHTML = `
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <strong class=" d-block" style="font-size: 1.1rem;">${data.subject || 'No Subject'}</strong>
                                <span class="text-muted-custom small">Reported by: ${data.reportedBy || 'Anonymous'} | Date: ${data.date || 'N/A'}</span>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                        <p class=" mt-3 mb-0" style="opacity: 0.9;">${data.message || 'No details provided.'}</p>
                        ${actions}
                    `;
                    listContainer.appendChild(card);
                });

            } catch(error) {
                console.error("Error fetching complaints: ", error);
                listContainer.innerHTML = '<div class="text-center text-danger py-4">Error loading data.</div>';
            }
        }

        // Resolve Complaint Logic
        window.resolveComplaint = async function(docId) {
            try {
                const ref = window.fsDoc(window.firebaseDb, 'complaints', docId);
                await window.fsUpdateDoc(ref, { status: 'resolved' });
                loadComplaints(); // Refresh list
            } catch(error) {
                console.error("Error resolving: ", error);
                window.customAlert("Error updating status.", "error");
            }
        }
    </script>
</body>
</html>
