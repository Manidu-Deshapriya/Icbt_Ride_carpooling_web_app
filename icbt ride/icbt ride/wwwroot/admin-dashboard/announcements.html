<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBT Ride - Announcements</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { overflow-x: hidden; }
        .wrapper { display: flex; width: 100%; }
        
        #sidebar { width: 250px; min-height: 100vh; flex-shrink: 0; position: fixed; z-index: 100; }
        #content { width: calc(100% - 250px); margin-left: 250px; padding: 30px; min-height: 100vh; }
        
        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background-color: var(--accent-secondary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .profile-text { font-size: 0.9rem; line-height: 1.2; }
        .verified-badge { color: var(--accent-success); font-size: 0.8rem; }
        .glass-box { background-color: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); padding: 25px; margin-bottom: 25px; }
        .box-title { color: var(--accent-primary); font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 1.1rem; }

        .announcement-card {
            background: rgba(14, 165, 233, 0.05);
            border-left: 4px solid var(--accent-primary);
            border-radius: 0 8px 8px 0;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="brand"><i class="fa-solid fa-car-side"></i> ICBT Ride</div>
            <ul class="list-unstyled">
                <li><a href="dashboard.html" class="nav-link text-decoration-none"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="users.html" class="nav-link text-decoration-none"><i class="fa-solid fa-users"></i> Users & Drivers</a></li>
                <li><a href="rides.html" class="nav-link text-decoration-none"><i class="fa-solid fa-route"></i> Ride Management</a></li>
                <li><a href="complaints.html" class="nav-link text-decoration-none"><i class="fa-solid fa-triangle-exclamation"></i> Complaints</a></li>
                <li><a href="announcements.html" class="nav-link active text-decoration-none"><i class="fa-solid fa-bullhorn"></i> Announcements</a></li>
            </ul>
            <div style="position: absolute; bottom: 30px; width: 100%;">
                <a href="#" id="logoutBtn" class="nav-link text-decoration-none text-danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
            
            <div class="top-header">
                <div>
                    <h2 class=" fw-bold mb-1">Announcements</h2>
                    <p class="text-muted-custom">Broadcast important messages to all drivers and passengers.</p>
                </div>
                <div class="user-profile">
                    <a href="users.html" class="position-relative me-3 text-decoration-none">
                        <i class="fa-regular fa-bell  fs-5"></i>
                        <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">0</span>
                    </a>
                    <div class="avatar" id="userInitial">A</div>
                    <div class="profile-text  text-end">
                        <span id="userEmail" class="d-block fw-bold">Admin</span>
                        <span class="verified-badge">Super Admin <i class="fa-solid fa-circle-check"></i></span>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Create Announcement Form -->
                <div class="col-md-5">
                    <div class="glass-box">
                        <div class="box-title"><i class="fa-solid fa-pen-to-square"></i> New Announcement</div>
                        <form id="announcementForm">
                            <div class="mb-3">
                                <label class="form-label text-muted-custom small">Title</label>
                                <input type="text" class="form-control" id="title" placeholder="e.g. System Maintenance" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted-custom small">Message</label>
                                <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill" id="submitBtn"><i class="fa-solid fa-paper-plane me-2"></i> Publish</button>
                        </form>
                    </div>
                </div>

                <!-- Past Announcements List -->
                <div class="col-md-7">
                    <div class="glass-box">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="box-title mb-0"><i class="fa-solid fa-clock-rotate-left"></i> Past Broadcasts</div>
                            <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="loadAnnouncements()"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        
                        <div id="announcementsList">
                            <div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import "./js/firebase-config.js";

        // Auth State Check
        window.onAuthStateChanged(window.firebaseAuth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInitial').textContent = user.email.charAt(0).toUpperCase();
                loadAnnouncements();
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try { await window.signOut(window.firebaseAuth); } 
            catch (error) { console.error("Error signing out: ", error); }
        });

        // Publish Announcement
        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const title = document.getElementById('title').value;
            const message = document.getElementById('message').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Publishing...';

            try {
                const colRef = window.fsCollection(window.firebaseDb, 'announcements');
                await window.fsAddDoc(colRef, {
                    title: title,
                    message: message,
                    date: new Date().toLocaleDateString(),
                    timestamp: new Date().getTime()
                });
                
                document.getElementById('announcementForm').reset();
                window.customAlert('Announcement published successfully!', 'success');
                loadAnnouncements();
            } catch(error) {
                console.error("Error publishing: ", error);
                window.customAlert("Failed to publish announcement.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Publish';
            }
        });

        // Fetch Announcements Logic
        window.loadAnnouncements = async function() {
            const listContainer = document.getElementById('announcementsList');
            listContainer.innerHTML = '<div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</div>';
            
            try {
                const colRef = window.fsCollection(window.firebaseDb, 'announcements');
                const snapshot = await window.fsGetDocs(colRef);
                
                if(snapshot.empty) {
                    listContainer.innerHTML = '<div class="text-center text-muted py-4">No announcements published yet.</div>';
                    return;
                }

                // In a real app, use fsQuery with orderBy('timestamp', 'desc'). For now, sort array in memory:
                const arr = [];
                snapshot.forEach(d => { arr.push({id: d.id, ...d.data()}) });
                arr.sort((a,b) => b.timestamp - a.timestamp);

                listContainer.innerHTML = '';
                arr.forEach((data) => {
                    const div = document.createElement('div');
                    div.className = 'announcement-card';
                    div.innerHTML = `
                        <div class="d-flex justify-content-between mb-2">
                            <strong class="">${data.title}</strong>
                            <small class="text-muted-custom">${data.date}</small>
                        </div>
                        <p class="text-muted-custom mb-0 small">${data.message}</p>
                    `;
                    listContainer.appendChild(div);
                });

            } catch(error) {
                console.error("Error fetching announcements: ", error);
                listContainer.innerHTML = '<div class="text-center text-danger py-4">Error loading data.</div>';
            }
        }
    </script>
</body>
</html>
