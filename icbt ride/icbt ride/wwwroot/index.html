<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICBT Ride - Campus Carpooling</title>
    <!-- Immediate Redirect to Main Login Screen -->
    <meta http-equiv="refresh" content="0; url=main-login/login.html" />
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICBT Ride">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d3b13 0%, #1B5E20 50%, #2e7d32 100%);
            color: #ffffff;
        }
        .loader-card {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 320px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { font-size: 1.3rem; margin-bottom: 6px; font-weight: 700; }
        p { font-size: 0.88rem; color: rgba(255, 255, 255, 0.8); }
    </style>
</head>

<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>ICBT Ride</h2>
        <p>Redirecting to Login...</p>
    </div>

    <script src="js/pwa-install.js"></script>
    <script>
        // Directly redirect to the Main Login screen
        window.location.replace('main-login/login.html');
    </script>
</body>

</html>
